version: 1

models:
  - name: contact
    config:
      tags: ["base"]
    columns:
      - name: uuid
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: saved_timestamp
        data_type: timestamp
        data_tests:
          - not_null
      - name: reported
        data_type: timestamp with time zone
        data_tests:
          - not_null
      - name: parent_uuid
        data_type: string
      - name: name
        data_type: string
        data_tests:
          - not_null
      - name: contact_type
        data_type: string
        data_tests:
          - not_null
      - name: active
        data_type: string
      - name: notes
        data_type: string
      - name: muted
        data_type: string
  - name: contact_type
    config:
      tags: ["base"]
    columns:
      - name: id
        data_type: string
      - name: person
        data_type: boolean
      - name: configured
        data_type: boolean
